# Blueprint do Render (render.com): New > Blueprint > conectar este repositório.
# Projeto conceitual sem banco: o plano gratuito basta (o serviço hiberna sem acessos).
services:
  - type: web
    name: ams-componentes
    runtime: docker
    plan: free
    region: oregon
    autoDeploy: true
    envVars:
      - key: PREVIEW_MODE
        value: "1"
      - key: SITE_URL
        value: https://ams-componentes.onrender.com
