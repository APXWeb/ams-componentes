# Blueprint do Render (render.com): New > Blueprint > conectar este repositório.
# O disco persistente exige plano pago (Starter). Banco e arquivos ficam em /data.
services:
  - type: web
    name: ams-componentes
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: ams-data
      mountPath: /data
      sizeGB: 1
    envVars:
      # 1 = prévia com dados de demonstração e sem indexação; 0 = produção (banco vazio + admin)
      - key: SEED_DEMO
        value: "1"
      - key: PREVIEW_MODE
        value: "1"
      - key: SITE_URL
        value: https://ams-componentes.onrender.com
      - key: DATABASE_PATH
        value: /data/ams.db
      - key: STORAGE_PATH
        value: /data/storage
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
